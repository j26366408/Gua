<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>江文樺｜415217073｜100分</title><style>body{max-width:700px;margin:50px auto;padding:20px;font:17px/1.8 system-ui;color:#172939;background:#f6f8f6}label{display:flex;justify-content:space-between;padding:15px 0;gap:15px;border-bottom:1px solid #ddd}select,button{font:inherit;padding:8px;border-radius:6px;border:1px solid #aaa}strong{font-size:44px;color:#08795e}button{margin-top:20px;background:#08795e;color:white}output{display:block}small{color:#596e7b}</style><h1>任務達成評分系統</h1><p>江文樺 · 415217073 · AI數值方法</p><p>請輸入前四題結果：達標給 20 分，未達標給 0 分。第五題依評分系統本身通過功能檢查給 20 分。</p><form id="form"><label for="q1">1. Fortran 編譯與執行<select id="q1"><option value="true">達標</option><option value="false">未達標</option></select></label><label for="q2">2. 三次隨機驗證<select id="q2"><option value="true">達標</option><option value="false">未達標</option></select></label><label for="q3">3. Git 原版與註解版提交<select id="q3"><option value="true">達標</option><option value="false">未達標</option></select></label><label for="q4">4. GitHub 雲端儲存<select id="q4"><option value="true">達標</option><option value="false">未達標</option></select></label><button type="submit">計算得分</button></form><output aria-live="polite"><strong id="score">100</strong> / 100 分</output><p id="breakdown"></p><small>此為依輸入狀態試算的分數，正式成績由教師評定。</small><script>(function (root) {
  function grade(results, systemWorks = true) {
    if (!Array.isArray(results) || results.length !== 4 || results.some(x => typeof x !== 'boolean')) {
      throw new TypeError('Exactly four boolean results are required.');
    }
    const questions = results.map(x => x ? 20 : 0);
    const fifth = systemWorks ? 20 : 0;
    return { questions, fifth, total: questions.reduce((a, b) => a + b, 0) + fifth };
  }
  if (typeof module !== 'undefined' && module.exports) module.exports = { grade };
  root.achievementGrade = grade;
})(typeof window !== 'undefined' ? window : globalThis);

let works=true;
for(let m=0;m<16;m++){const a=[0,1,2,3].map(i=>!!(m&(1<<i)));if(achievementGrade(a).total!==a.filter(Boolean).length*20+20)works=false;}
function update(){const a=[1,2,3,4].map(i=>document.getElementById('q'+i).value==='true');const g=achievementGrade(a,works);document.getElementById('score').textContent=g.total;document.getElementById('breakdown').textContent='各題得分：'+g.questions.concat(g.fifth).join('、');document.title='江文樺｜415217073｜'+g.total+'分';}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();update();});update();</script></html>
